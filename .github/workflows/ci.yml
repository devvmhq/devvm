name: CI

# Docs-only changes run only the Docs workflow's checks. Later patterns win:
# the CLI reference is generated, and a test checks it is current.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "docs/content/docs/cli/**"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "docs/content/docs/cli/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The tests run on macOS in UTC and on Linux in a zone with DST, so a
    # test that depends on the zone fails here, not only on a laptop. Lint
    # runs on both, because golangci-lint checks only the files built for
    # the runner's OS, such as internal/platform's *_darwin.go or *_linux.go.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, tz: America/Los_Angeles }
          - { os: macos-latest, tz: UTC }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
      - run: mise run lint
      - run: mise run test
        env:
          TZ: ${{ matrix.tz }}
