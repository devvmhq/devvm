name: Fuzz

# go test runs only each fuzz target's seeds; this runs every target for a
# few minutes a week. The list is read from the tests, so a new target is
# fuzzed without editing this file.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each target as {"pkg","name"}, the proxy's first.
      - id: list
        run: |
          set -euo pipefail
          lines=$(grep -rHo --include='*_test.go' '^func Fuzz[A-Za-z0-9_]*' internal \
            | sed -E 's#^(.*)/[^/]*:func (Fuzz[A-Za-z0-9_]*)$#\1 \2#' \
            | sort -u | awk '{print ($1 ~ /^internal\/proxy$/ ? 0 : 1), $0}' | sort -k1,1n -k2 | cut -d' ' -f2-)
          test -n "$lines"
          matrix=$(printf '%s\n' "$lines" | awk 'BEGIN{printf "["} {if (NR>1) printf ","; printf "{\"pkg\":\"./%s\",\"name\":\"%s\"}", $1, $2} END{printf "]"}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    name: ${{ matrix.target.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
      - run: go test -run '^$' -fuzz "^${NAME}\$" -fuzztime 2m "$PKG"
        env:
          NAME: ${{ matrix.target.name }}
          PKG: ${{ matrix.target.pkg }}
      # A failing input lands in the package's testdata/fuzz/<target>/;
      # committed there, go test runs it as a seed.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target.name }}
          path: ${{ matrix.target.pkg }}/testdata/fuzz/${{ matrix.target.name }}/
          if-no-files-found: ignore
