name: Docs

# Pull requests touching the docs get their lints and a build; main deploys when the docs change.
# The site is built from docs/ alone (the CLI reference included, which a help change commits
# there), and CI's lint runs the docs checks on every code change, so other pushes skip this.
# Both triggers take the same paths; workflow_dispatch deploys by hand.
on:
  push:
    branches: [main]
    paths: &docs-paths
      - "docs/**"
      - "**.md"
      - ".vale.ini"
      - ".vale/**"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: *docs-paths
  workflow_dispatch:

permissions:
  contents: read

# Deploys queue one after another; a pull request's newer run replaces its last.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Only the docs' tools, not every tool in mise.toml.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, for each page's last updated date.
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.18
          install_args: go hugo-extended node markdownlint-cli2 vale lychee
      - run: mise run lint:docs
      # The site's address is baseURL in docs/hugo.yaml.
      - run: hugo -s docs --minify
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy the site
      id-token: write # to prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
