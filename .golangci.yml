version: "2"

# The end-to-end tests in Go (tests/e2e) build only with this tag.
run:
  build-tags:
    - e2e

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - reassign
    - revive
    - unconvert
    - usestdlibvars
  settings:
    depguard:
      rules:
        # The proxy, and the background-process helper it uses: the
        # standard library alone.
        proxy:
          list-mode: strict
          files:
            - "**/internal/proxy/**"
            - "**/internal/daemon/**"
          allow:
            - $gostd
            - github.com/devvmhq/devvm/internal/proxy
            - github.com/devvmhq/devvm/internal/daemon
        # Linux's .git lock helper, which runs with CAP_LINUX_IMMUTABLE:
        # the standard library and golang.org/x/sys alone, none of devvm's.
        immutable:
          list-mode: strict
          files:
            - "**/cmd/devvm-immutable/**"
          allow:
            - $gostd
            - golang.org/x/sys
        main:
          list-mode: strict
          files:
            - $all
            - "!$test"
            - "!**/internal/proxy/**"
            - "!**/internal/daemon/**"
            - "!**/cmd/devvm-immutable/**"
          allow:
            - $gostd
            - github.com/devvmhq/devvm
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            # The CLI reference generator (approved).
            - github.com/spf13/cobra/doc
            - github.com/nicksnyder/go-i18n/v2
            # The TOML parser go-i18n's docs register for locales/*.toml
            # (approved; the generator reads en.toml with it too).
            - github.com/BurntSushi/toml
            - golang.org/x/text
            - golang.org/x/term
            - golang.org/x/sys
            # BLAKE2b, for minisign's prehashed signatures, which devvm
            # upgrade checks (approved; nothing else of x/crypto).
            - golang.org/x/crypto/blake2b
        tests:
          list-mode: strict
          files:
            - $test
            - "!**/internal/proxy/**"
            - "!**/internal/daemon/**"
            - "!**/cmd/devvm-immutable/**"
          allow:
            - $gostd
            - github.com/devvmhq/devvm
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            - github.com/nicksnyder/go-i18n/v2
            - github.com/BurntSushi/toml
            - golang.org/x/text
            - golang.org/x/term
            - golang.org/x/sys
            - golang.org/x/crypto/blake2b
            - github.com/rogpeppe/go-internal
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.Exit$
          msg: return an error; only cmd/devvm exits.
        - pattern: ^fmt\.Print(f|ln)?$
          msg: print through internal/ui.
        - pattern: ^os\.(Stdout|Stderr)$
          msg: print through internal/ui.
        - pattern: ^context\.(Background|TODO)$
          msg: take the caller's ctx; a fresh one only where it must outlive it, with a nolint saying why.
        - pattern: ^(runtime\.NumCPU|unix\.(Statfs|Fstatfs|Sysinfo|SysctlUint64)|syscall\.(Statfs|Fstatfs|Sysinfo))$
          msg: read the host's CPUs, memory and free space through platform.Host, which test builds can override.
        - pattern: ^testbuild\.On$
          msg: only internal/cli asks whether this is a test build, in readOverrides; take its overrides as fields.
        - pattern: ^(os\.FindProcess|syscall\.Kill|unix\.Kill|os\.Process\.(Kill|Signal))$
          msg: signal processes through internal/daemon (Proc, Handle, Alive, Signal), which checks a pid is still the process it was.
        - pattern: ^http\.(Client|DefaultClient|DefaultTransport|Transport|Get|Head|Post|PostForm)$
          msg: reach the web through internal/fetch (fetch.NewClient, and its Transport to change), which sets the timeout, the redirect policy and retries.
        - pattern: ^os\.UserHomeDir$
          msg: take the home folder from paths.Dirs.Home, the one place devvm reads HOME.
        - pattern: ^os\.(WriteFile|Create|O_TRUNC)$
          msg: write a file whole through state.WriteFile, or state.WriteFileMode for another mode, which replace it atomically; internal/proxy uses its writeAtomic; a log or a download streamed into its file says why in a nolint.
        - pattern: ^(os|syscall)\.(Setenv|Unsetenv|Clearenv)$
          msg: devvm's environment never changes, as every command and process it starts inherits it; set a command's own (exec.Cmd's Env), as a VM's SSH agent is (backend.ExecOpts.Agent). Only daemon.Ready takes its status file out.
    nolintlint:
      require-explanation: true
      require-specific: true
    reassign:
      patterns:
        - ".*"
    revive:
      enable-default-rules: true
      rules:
        # Just above the largest today: statements, then lines.
        - name: function-length
          arguments: [100, 160]
        - name: cognitive-complexity
          arguments: [75]
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: ^cmd/devvm/
        linters: [forbidigo]
        text: os\.Exit|context\.(Background|TODO)
      # devvm-immutable is a program of its own, without devvm's UI: it
      # writes its errors to stderr and exits with its status.
      - path: ^cmd/devvm-immutable/
        linters: [forbidigo]
        text: os\.(Stdout|Stderr|Exit)
      # The end-to-end runner is a test, not devvm: it prints its results,
      # TestMain exits with m.Run's code, and it stops its own checks'
      # process groups and reads whether a lock's process is alive.
      - path: ^tests/e2e/
        linters: [forbidigo]
        text: fmt\.Print|os\.(Stdout|Stderr|Exit)|signal processes through internal/daemon
      # Running the sections' commands and reading the sandbox's files by
      # their paths is what it's for.
      - path: ^tests/e2e/
        linters: [gosec]
        text: G204|G304|G702|G703
      - path: ^internal/ui/
        linters: [forbidigo]
        text: fmt\.Print|os\.(Stdout|Stderr)|context\.(Background|TODO)
      - path: ^internal/platform/
        linters: [forbidigo]
        text: runtime\.NumCPU|unix\.|syscall\.
      - path: ^internal/cli/
        linters: [forbidigo]
        text: testbuild\.On
      # daemon and platform signal processes; tests signal their own
      # children (exec.Cmd's Process).
      - path: ^internal/(daemon|platform)/
        linters: [forbidigo]
        text: signal processes through internal/daemon
      - path: _test\.go$
        linters: [forbidigo]
        text: Process\.(Kill|Signal)`
      # The proxy is the standard library only, and tests make their own
      # servers' clients.
      - path: ^internal/(fetch|proxy)/|_test\.go$
        linters: [forbidigo]
        text: reach the web through internal/fetch
      # state's own writer; the proxy's (standard library only); the
      # message generator (a leaf); test stubs; and tests' fixtures.
      - path: ^internal/(state|proxy|msg/gen|stubtest)/|_test\.go$
        linters: [forbidigo]
        text: os\.(WriteFile|Create|O_TRUNC)
      # A background process takes its status file out of its own
      # environment (daemon.Ready); tests set theirs with t.Setenv.
      - path: ^internal/daemon/status\.go$|_test\.go$
        linters: [forbidigo]
        text: devvm's environment never changes
    paths:
      - ^\.agents/

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/devvmhq/devvm
  exclusions:
    paths:
      - ^\.agents/
