version: "2"

# The end-to-end tests in Go (tests/e2e) build only with this tag.
run:
  build-tags:
    - e2e

linters:
  default: standard
  enable:
    - bodyclose
    - canonicalheader
    - contextcheck
    - depguard
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gochecksumtype
    - gocritic
    - gosec
    - misspell
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - reassign
    - revive
    - unconvert
    - usestdlibvars
  settings:
    depguard:
      rules:
        # The proxy, and the background-process helper, the file reader,
        # the child's confinement, the VM names and the secrets' type it
        # uses: the standard library alone, and each other; and the leak
        # checks and the network in memory, which their tests use.
        proxy:
          list-mode: strict
          files:
            - "**/internal/proxy/**"
            - "**/internal/landlock/**"
            - "**/internal/daemon/**"
            - "**/internal/safefile/**"
            - "**/internal/vmname/**"
            - "**/internal/leaktest/**"
            - "**/internal/redact/**"
            - "**/internal/memnet/**"
          allow:
            - $gostd
            - github.com/devvmhq/devvm/internal/proxy
            - github.com/devvmhq/devvm/internal/landlock
            - github.com/devvmhq/devvm/internal/daemon
            - github.com/devvmhq/devvm/internal/safefile
            - github.com/devvmhq/devvm/internal/vmname
            - github.com/devvmhq/devvm/internal/leaktest
            - github.com/devvmhq/devvm/internal/redact
            - github.com/devvmhq/devvm/internal/memnet
        main:
          list-mode: strict
          files:
            - $all
            - "!$test"
            - "!**/internal/proxy/**"
            - "!**/internal/landlock/**"
            - "!**/internal/daemon/**"
            - "!**/internal/safefile/**"
            - "!**/internal/vmname/**"
            - "!**/internal/leaktest/**"
            - "!**/internal/redact/**"
            - "!**/internal/memnet/**"
          allow:
            - $gostd
            - github.com/devvmhq/devvm
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            # The CLI reference generator (approved).
            - github.com/spf13/cobra/doc
            - github.com/nicksnyder/go-i18n/v2
            # The TOML parser go-i18n's docs register for locales/*.toml
            # (approved; the generator reads en.toml with it too).
            - github.com/BurntSushi/toml
            - golang.org/x/text
            - golang.org/x/term
            - golang.org/x/sys
            # BLAKE2b, for minisign's prehashed signatures, which devvm
            # upgrade checks (approved; nothing else of x/crypto).
            - golang.org/x/crypto/blake2b
        tests:
          list-mode: strict
          files:
            - $test
            - "!**/internal/proxy/**"
            - "!**/internal/landlock/**"
            - "!**/internal/daemon/**"
            - "!**/internal/safefile/**"
            - "!**/internal/vmname/**"
            - "!**/internal/leaktest/**"
            - "!**/internal/redact/**"
            - "!**/internal/memnet/**"
          allow:
            - $gostd
            - github.com/devvmhq/devvm
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            - github.com/nicksnyder/go-i18n/v2
            - github.com/BurntSushi/toml
            - golang.org/x/text
            - golang.org/x/term
            - golang.org/x/sys
            - golang.org/x/crypto/blake2b
            - github.com/rogpeppe/go-internal
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.Exit$
          msg: return an error; only cmd/devvm exits.
        - pattern: ^fmt\.Print(f|ln)?$
          msg: print through internal/ui.
        - pattern: ^os\.(Stdout|Stderr)$
          msg: print through internal/ui.
        - pattern: ^context\.(Background|TODO)$
          msg: take the caller's ctx; a fresh one only where it must outlive it, with a nolint saying why.
        - pattern: ^(runtime\.NumCPU|unix\.(Statfs|Fstatfs|Sysinfo|SysctlUint64)|syscall\.(Statfs|Fstatfs|Sysinfo))$
          msg: read the host's CPUs, memory and free space through platform.Host, which test builds can override.
        - pattern: ^testbuild\.On$
          msg: only internal/cli asks whether this is a test build, in readOverrides; take its overrides as fields.
        - pattern: ^(os\.FindProcess|syscall\.Kill|unix\.Kill|os\.Process\.(Kill|Signal))$
          msg: signal processes through internal/daemon (Proc, Handle, Alive, Signal), which checks a pid is still the process it was.
        - pattern: ^http\.(Client|DefaultClient|DefaultTransport|Transport|Get|Head|Post|PostForm)$
          msg: reach the web through internal/fetch (fetch.NewClient, and its Transport to change), which sets the timeout, the redirect policy and retries.
        - pattern: ^os\.UserHomeDir$
          msg: take the home folder from paths.Dirs.Home, the one place devvm reads HOME.
        - pattern: ^os\.(WriteFile|Create|O_TRUNC)$
          msg: write a file whole through state.WriteFile, or state.WriteFileMode for another mode, which replace it atomically; internal/proxy uses its writeAtomic; a log or a download streamed into its file says why in a nolint.
        - pattern: ^(os|syscall)\.(Setenv|Unsetenv|Clearenv)$
          msg: devvm's environment never changes, as every command and process it starts inherits it; set a command's own (exec.Cmd's Env), as a VM's SSH agent is (backend.ExecOpts.Agent). Only daemon.Ready takes its status file out.
        - pattern: ^unicode\.(IsGraphic|IsPrint|IsControl|Bidi_Control)$
          msg: ask msg.Safe which characters reach the terminal (msg.Printable and msg.OneLine drop the rest); a check that isn't about the terminal says why in a nolint.
        - pattern: ^(os\.(Open|OpenFile|ReadFile|OpenRoot|OpenInRoot|DirFS)|os\.Root\.(Open|OpenFile|ReadFile|FS))$
          msg: read a file a VM can write through internal/safefile (Read, Open, OpenRoot), which never waits on a FIFO or follows a link it wasn't asked to, and reads only a regular file within its cap; what opens a file to write, or a folder, says why in a nolint.
        - pattern: ^os\.(Chmod|Chtimes|Chown|Lchown|Truncate)$
          msg: change a file through what opened it (os.File's Chmod, Chown and Truncate, or an os.Root's methods), never by its path, which a VM can swap for a link between the open and the change; a path only devvm writes, such as a socket it just made, says why in a nolint.
        - pattern: ^netip\.Addr\.IsPrivate$
          msg: ask proxy.Public whether an address is on the internet, the one table of the ranges that aren't.
        - pattern: ^msg\.StatusOf$
          msg: show a lock's wait through the Reporter your constructor takes (msg.Waiting with its Status); only internal/state and internal/trust, which take none, read the run's status from the context.
        - pattern: ^redact\.Secret\.Reveal$
          msg: pass the redact.Secret on; its value is revealed only where it must be used (a header, a file only the user can read, the Keychain), with a //nolint:forbidigo that says why.
    # A value errchkjson proves encodes without fail drops the error; any
    # other checks it, so a field that could fail gets its check back.
    errchkjson:
      check-error-free-encoding: true
      report-no-exported: true
    # A switch on a sum type's type (//sumtype:decl) names every case, as
    # exhaustive holds a switch on an enum's values to.
    gochecksumtype:
      default-signifies-exhaustive: false
    govet:
      enable:
        - hostport
        - nilness
        - unusedwrite
        - waitgroup
    nolintlint:
      require-explanation: true
      require-specific: true
    reassign:
      patterns:
        - ".*"
    revive:
      enable-default-rules: true
      rules:
        # Just above the largest today: statements, then lines.
        - name: function-length
          arguments: [100, 160]
        - name: cognitive-complexity
          arguments: [75]
  exclusions:
    presets:
      - std-error-handling
    rules:
      # msg.Safe is the one rule for which characters reach the terminal.
      - path: ^internal/msg/
        linters: [forbidigo]
        text: ask msg\.Safe
      - path: ^cmd/devvm/
        linters: [forbidigo]
        text: os\.Exit|context\.(Background|TODO)
      # The end-to-end runner is a test, not devvm: it prints its results,
      # TestMain exits with m.Run's code, and it stops its own checks'
      # process groups and reads whether a lock's process is alive.
      - path: ^tests/e2e/
        linters: [forbidigo]
        text: fmt\.Print|os\.(Stdout|Stderr|Exit)|signal processes through internal/daemon
      # Running the sections' commands and reading the sandbox's files by
      # their paths is what it's for.
      - path: ^tests/e2e/
        linters: [gosec]
        text: G204|G304|G702|G703
      # A test's helpers write the paths its own temp folder names. gosec's
      # taint analysis reports some of them on some runs and not others
      # (internal/gitprotect's write), so a nolint would fail nolintlint.
      - path: _test\.go$
        linters: [gosec]
        text: G703
      # A test's assertion that fails panics, which fails the run and names
      # the line.
      - path: _test\.go$
        linters: [forcetypeassert]
      # Tests encode values they built or decoded themselves, of strings,
      # numbers, lists and maps, which always encode.
      - path: _test\.go$
        linters: [errchkjson]
        text: is not checked
      - path: ^internal/ui/
        linters: [forbidigo]
        text: fmt\.Print|os\.(Stdout|Stderr)|context\.(Background|TODO)
      - path: ^internal/platform/
        linters: [forbidigo]
        text: runtime\.NumCPU|unix\.|syscall\.
      - path: ^internal/cli/
        linters: [forbidigo]
        text: testbuild\.On
      # proxy.Public is the judge of internet addresses.
      - path: ^internal/proxy/
        linters: [forbidigo]
        text: ask proxy\.Public
      # daemon and platform signal processes; tests signal their own
      # children (exec.Cmd's Process).
      - path: ^internal/(daemon|platform)/
        linters: [forbidigo]
        text: signal processes through internal/daemon
      - path: _test\.go$
        linters: [forbidigo]
        text: Process\.(Kill|Signal)`
      # The proxy is the standard library only, and tests make their own
      # servers' clients.
      - path: ^internal/(fetch|proxy)/|_test\.go$
        linters: [forbidigo]
        text: reach the web through internal/fetch
      # The packages that take no Reporter show a lock's wait through the context.
      - path: ^internal/(state|trust|msg)/|_test\.go$
        linters: [forbidigo]
        text: msg\.StatusOf
      # state's own writer; the proxy's (standard library only); the
      # message generator (a leaf); test stubs; and tests' fixtures.
      - path: ^internal/(state|proxy|msg/gen|stubtest)/|_test\.go$
        linters: [forbidigo]
        text: os\.(WriteFile|Create|O_TRUNC)
      # A background process takes its status file out of its own
      # environment (daemon.Ready); tests set theirs with t.Setenv.
      - path: ^internal/daemon/status\.go$|_test\.go$
        linters: [forbidigo]
        text: devvm's environment never changes
      # The readers of files a VM can write, or swap, are held to
      # internal/safefile: the project folder's (devcontainer.json, its
      # default.nix, .git's), devvm agent save's store, devvm paste's copied
      # file, the agents' logins and the policy files, the logs a VM drives
      # (vmlog, and the proxy's rotate.go) and the Nix cache. Tests make
      # their own fixtures.
      - path-except: ^internal/(gitprotect/|vm/(devcontainer|detect|paste|agentsave[a-z_]*)\.go$|agentlogin/|netpolicy/rules\.go$|proxy/(config|policy|rotate|nixcache)\.go$|vmlog/)|^testdata/lint/
        linters: [forbidigo]
        text: internal/safefile
      - path: _test\.go$
        linters: [forbidigo]
        text: internal/safefile
      # The packages that change files a VM can write or swap (the proxy's
      # logs and Nix cache, the logs vmlog keeps, and vmssh's sockets and
      # files beside the VM's) change them through what opened them. Tests
      # make their own fixtures.
      - path-except: ^internal/(proxy|vmlog|vmssh)/|^testdata/lint/
        linters: [forbidigo]
        text: never by its path
      - path: _test\.go$
        linters: [forbidigo]
        text: never by its path
      # A secret's value is revealed where it's used, each call with a
      # //nolint:forbidigo that says why. Tests check the values.
      - path: _test\.go$
        linters: [forbidigo]
        text: pass the redact\.Secret on
    paths:
      - ^\.agents/

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/devvmhq/devvm
  exclusions:
    paths:
      - ^\.agents/
