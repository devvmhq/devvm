[settings]
lockfile = true

[env]
CGO_ENABLED = "0"

[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
gotestsum = "1.13.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
goreleaser = "2.19.0"
hugo-extended = "0.168.0"
vale = "3.25.1"
lychee = "0.24.2"
node = "24.22.1"
markdownlint-cli2 = "0.24.0"
shellcheck = "0.11.0"
actionlint = "1.7.12"
zizmor = "1.31.1"
# Only for signing releases; it has no linux/arm64 build.
minisign = { version = "0.12", os = ["macos/arm64", "linux/x64", "windows"] }

[tasks.fmt]
description = "Format Go code"
run = "golangci-lint fmt"

[tasks.lint]
description = "Run every linter"
depends = ["lint:code", "lint:docs"]

[tasks."lint:code"]
description = "Lint the Go code, shell scripts and GitHub workflows"
run = [
  "golangci-lint run",
  # Each forbidigo rule fires: testdata/lint breaks each once, on the lines
  # ending in "// want forbidigo", and forbidigo reports those lines alone.
  '''
  want=$(grep -Hn '// want forbidigo$' testdata/lint/*.go | cut -d: -f1,2 | sort)
  got=$(golangci-lint run --enable-only forbidigo --max-same-issues=0 --max-issues-per-linter=0 \
    --output.text.print-issued-lines=false --show-stats=false ./testdata/lint/ | grep '(forbidigo)$' | cut -d: -f1,2 | sort)
  [ "$want" = "$got" ] || { printf 'forbidigo reported:\n%s\ntestdata/lint wants:\n%s\n' "$got" "$want" >&2; exit 1; }
  ''',
  # The workflows: actionlint (with shellcheck on run steps), then zizmor's
  # security audits, offline so a run never depends on GitHub's API.
  "actionlint",
  "zizmor --offline .",
  # Shell scripts, found by a shebang on their first line (not the
  # testscript archives, which hold small scripts among other files, nor the
  # vendored security-audit skill).
  '''
  git ls-files --cached --others --exclude-standard -z -- . ':!:.agents/skills/security-audit' ':!:testdata/script' |
    LC_ALL=C xargs -0 awk 'FNR == 1 { if ($0 ~ /^#!.*[\/ ](ba|da)?sh( |$)/) print FILENAME; nextfile }' |
    xargs -r shellcheck --external-sources
  ''',
]

[tasks."lint:docs"]
description = "Lint the docs"
run = [
  # Every Markdown file but the vendored security-audit skill's.
  "markdownlint-cli2 'docs/content/**/*.md' '*.md' 'assets/**/*.md' 'internal/**/*.md' '.agents/skills/docs-voice/*.md' '.agents/skills/cli/*.md'",
  # .vale.ini says which rules each file gets, and which files get none.
  "vale docs/content *.md assets/oci/README.md internal/proxy/README.md .agents/skills/docs-voice .agents/skills/cli",
  "lychee --offline --no-progress --include-fragments 'docs/content/**/*.md'",
  # Message links: every doc link in internal/msg/docs.go is a message and
  # a page and heading in docs/content/docs.
  "go test ./internal/msg -run '^TestDocLinks$'",
  # Command lines: every devvm command line in the repo is one of devvm's.
  "go test ./internal/cli -run '^TestCommandLines$'",
  # Social cards: every page has an explainer, and it and the title fit the card.
  "go test ./internal/cli/docgen -run '^TestExplainers$'",
  # The site builds with no warning, a deprecation's included, into a folder
  # the run removes.
  "d=$(mktemp -d) && trap 'rm -rf \"$d\"' EXIT && hugo -s docs --quiet --panicOnWarning -d \"$d\"",
]

[tasks.test]
description = "Run the unit and CLI tests, and hold each package to its coverage baseline"
env = { CGO_ENABLED = "1" }
# scripts/test.sh: a throwaway HOME, the race detector, 30 minutes a package,
# then each package's coverage against this system's baseline in testdata/coverage/.
run = "scripts/test.sh"

[tasks.coverage]
description = "Run the tests and raise each package's coverage baseline"
env = { CGO_ENABLED = "1" }
run = "scripts/test.sh --raise"

[tasks.vuln]
description = "Check dependencies for known vulnerabilities"
run = "govulncheck ./..."

[tasks.deadcode]
description = "List functions nothing calls"
run = "go run golang.org/x/tools/cmd/deadcode@v0.52.0 ./..."

[tasks.cli-docs]
description = "Generate the CLI reference (docs/content/docs/cli)"
run = "go run ./internal/cli/docgen docs/content/docs/cli"

[tasks.docs]
description = "Serve the docs site"
depends = ["cli-docs"]
run = "hugo server -s docs"

[tasks.e2e]
description = "Run the end-to-end tests against real VMs (tests/e2e), its flags after --"
dir = "{{config_root}}/tests/e2e"
env = { CGO_ENABLED = "0" }
run = "go test -tags e2e -count=1 -timeout 0 -run '^TestE2E$' -args"
