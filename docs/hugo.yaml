baseURL: https://devvm.dev/
title: devvm
locale: en

security:
  http:
    proxyFromEnvironment: true

enableRobotsTXT: true
enableGitInfo: true

module:
  hugoVersion:
    extended: true
    min: "0.146.0"
  imports:
    - path: github.com/imfing/hextra
  # The diagrams that render-diagrams.mjs draws before the build (mise run docs:diagrams), which git
  # ignores, as assets/diagrams for the mermaid render hook. A mount of assets replaces Hugo's own, so
  # assets is mounted too.
  mounts:
    - source: assets
      target: assets
    - source: .build/diagrams
      target: assets/diagrams

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

# llms.txt at the site root, and a Markdown copy beside each page for the Copy page menu.
outputs:
  home: [html, rss, llms]
  page: [html, markdown]
  section: [html, rss, markdown]

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: https://github.com/devvmhq/devvm
      params:
        icon: dinkie-github

params:
  description: "One VM for every project: an isolated sandbox with your project's toolchain, ready for you or an agent to start coding."
  # No images: each page's og:image and twitter:image is its own card, which
  # layouts/_partials/og-image.html draws.
  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: branding/devvm-logo-on-dark.svg
      width: 125
      height: 43
  theme:
    default: dark
    displayToggle: false
  footer:
    displayCopyright: false
    displayPoweredBy: false
  displayUpdatedDate: true
  page:
    contextMenu:
      enable: true
  search:
    enable: true
    type: flexsearch
  editURL:
    enable: true
    base: https://github.com/devvmhq/devvm/edit/main/docs/content
  highlight:
    copy:
      enable: true
      display: hover
